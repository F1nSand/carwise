name: agent-eval

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  backend:
    if: github.event_name != 'schedule'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: >-
          python -m pytest -q
          tests/test_auth.py
          tests/test_configuration.py
          tests/test_clean_dcd.py
          tests/test_context_budget.py
          tests/test_agent_control_tools.py
          tests/test_skills.py
          tests/test_sqlite_repository.py
          tests/test_runtime_migration.py
          tests/test_session_store.py
          tests/test_run_store.py
          tests/test_event_notifier.py
          tests/test_message_protocol.py
          tests/test_mcp_adapter.py

  frontend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:run
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Dockerfile copies the configured parquet path. This empty artifact only
      # allows the image and skills smoke check to build; it contains no car data.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas pyarrow
      - run: mkdir -p data/clean && python -c "import pandas as pd; pd.DataFrame().to_parquet('data/clean/dcd_clean.parquet', index=False)"
      - run: docker build -f backend/Dockerfile -t used-car-backend:ci .
      - run: docker build -f frontend/Dockerfile -t used-car-frontend:ci frontend
      - run: docker run --rm --entrypoint python used-car-backend:ci -c "from pathlib import Path; from backend.agent_runtime.skills import discover_skills, load_skill; routes = discover_skills(Path('/app')); assert len(routes) == 4; [load_skill('/app', route.name) for route in routes]"
